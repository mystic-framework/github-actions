name: "Pre Commit"
description: "Runs pre-commit to conduct basic hygiene checks."

inputs:
  use-cache:
    description: "Enable or disable caching for pre-commit hooks."
    required: false
    default: "true"
  args:
    description: "Arguments passed to pre-commit."
    required: false
    default: "--all-files"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
        cache: ${{ inputs.use-cache == 'true' && 'pip' || '' }}
        cache-dependency-path: ".pre-commit-config.yaml"

    - name: Set up pre-commit cache
      id: cache-pre-commit
      if: ${{ inputs.use-cache == 'true' }}
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: pre-commit-${{ runner.os }}-

    - name: Run pre-commit
      shell: bash
      env:
        PRE_COMMIT_HOME: ${{ github.workspace }}/.cache/pre-commit
        ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        echo "Running pre-commit..."
        pip install --disable-pip-version-check pre-commit
        pre-commit run $ARGS
        echo "All checks passed!"
